<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanctuary">
<meta name="theme-color" content="#1b1712">
<title>Ultimate Sanctuary</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#1b1712;color:#f3eadb;font:18px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:46rem;margin:0 auto;padding:1rem 1rem 6rem}
h1{font-size:1.8rem;margin:.4rem 0 0}
.ver{margin:0 0 .6rem;color:#d8c8ad}
#status{min-height:1.5em;background:#2a231b;border-left:4px solid #d9a441;padding:.5rem .7rem;border-radius:6px}
.big{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0}
.big button{flex:1 1 9rem;font-size:1.4rem;padding:1.1rem;border-radius:14px;border:2px solid #d9a441;background:#3a2c18;color:#fff;font-weight:700}
.big #stopBtn{background:#2b1f1f;border-color:#c77}
button{font:inherit;padding:.55rem .8rem;border-radius:10px;border:1px solid #8a7656;background:#2e261d;color:#f3eadb;margin:.25rem 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd36b;outline-offset:2px}
.sec{border-top:1px solid #4a3e2e;margin-top:.4rem}
.sec h2{margin:0;font-size:1.25rem}
.sechead{width:100%;text-align:left;background:none;border:none;padding:.9rem .2rem;font-size:1.25rem;font-weight:700;color:#ffe1a6}
.sechead[aria-expanded="true"]::after{content:" \25B2";font-size:.8em}
.sechead[aria-expanded="false"]::after{content:" \25BC";font-size:.8em}
.secbody{padding:0 .2rem 1rem}
.layer{border:1px solid #4a3e2e;border-radius:10px;padding:.4rem .8rem .6rem;margin:.7rem 0;background:#231d16}
.layer h3,.secbody>h3{font-size:1.1rem;margin:.5rem 0 .2rem;color:#ffe9c2}
.about,.hint{color:#d8c8ad;margin:.2rem 0 .5rem;font-size:.95rem}
.field{margin:.5rem 0}
.field label{display:block}
.val{color:#ffd36b}
input[type=range]{width:100%;height:2.2rem}
select,input[type=text]{font:inherit;width:100%;padding:.45rem;border-radius:8px;background:#120f0b;color:#f3eadb;border:1px solid #8a7656}
.check{display:flex;align-items:center;gap:.6rem;margin:.5rem 0}
.check input{width:1.6rem;height:1.6rem}
.lstate{margin:.3rem 0;font-style:italic}
.room li,.presets li{margin:.4rem 0}
a{color:#ffd36b}
</style>
</head>
<body>
<main>
<h1>Ultimate Sanctuary</h1>
<p class="ver">Version 1. Every world in one place: Clock and Fire, London, Countryside, Ocean and Underwater, River and Water Cycle, and Primordial.</p>
<p id="status" role="status" aria-live="polite" aria-atomic="true">Ultimate Sanctuary version 1. Loading.</p>
<div class="big">
<button type="button" id="startBtn">Start</button>
<button type="button" id="stopBtn">Stop</button>
</div>
<p><button type="button" id="describeBtn">Who is in the room?</button> <span id="playState">Stopped.</span></p>
<p><button type="button" id="resumeBtn" hidden>Resume session</button></p>
<div id="resumeLast" hidden><p id="resumeLastInfo"></p><button type="button" id="resumeLastBtn">Resume the last session</button></div>
<div id="app"></div>
<audio id="liveOut" playsinline hidden></audio>
</main>
<script>window.US_BASES={};</script>
<script src="conductor.js"></script>
<script src="ens.js"></script>
<script src="app.js"></script>
</body>
</html>
